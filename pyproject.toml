[project]
name = "volley-overlay-control"
version = "0.0.0"
description = "Self-hostable web application for controlling volleyball overlays."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "requests==2.34.2",
    # Browser-compatible UTS #46 normalization for CSP frame origins.
    "idna>=3.19",
    "python-dotenv==1.2.3",
    "websocket-client>=1.9.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.26.0",
    # The integration remains inert until SENTRY_DSN is configured.
    "sentry-sdk[fastapi]>=2.68.1,<3",
    # Database layer (multi-user refactor): SQLAlchemy ORM + Alembic migrations.
    # DATABASE_URL selects the backend: SQLite (the default) or Postgres via
    # ``postgresql+psycopg://...``. The psycopg 3 driver below ships in the image
    # (``[binary]`` bundles libpq), so Postgres works with no rebuild — just point
    # DATABASE_URL at a server. It is a small unconditional add even for the
    # SQLite-only default; that keeps the published image Postgres-ready.
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    # Security floor — patches CVE-2026-44431 / CVE-2026-44432 (urllib3 2.6.x).
    # ``requests`` allows urllib3 < 3, so this constraint just pulls the
    # transitive dep up to the fixed minor without touching API surface.
    "urllib3>=2.7.0",
    # Security floor — patches CVE-2026-48817 / CVE-2026-48818 / CVE-2026-54282 /
    # CVE-2026-54283 (starlette < 1.3.1). ``fastapi`` pulls starlette in
    # transitively; this constraint lifts it past the fixed release — the floor
    # tracks the current release line, which sits above the 1.3.1 CVE fix.
    "starlette>=1.6.0",
    # Hosted icon library: multipart parsing for the upload endpoints and
    # Pillow for server-side decode/resize/WebP re-encode of team icons.
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

# Test-only dependencies (PEP 735). ``uv sync`` installs these by default;
# the runtime image builds with ``--no-dev`` so they never ship.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "httpx>=0.28.1",
]

# The app runs from the source tree (``app/`` + ``main.py``); it is not an
# installable distribution and there is no build backend. ``package = false``
# tells uv to resolve and install the dependencies without trying to build
# this project itself.
[tool.uv]
package = false

[tool.ruff]
line-length = 127
target-version = "py314"
extend-exclude = [
    "frontend",
    "overlay_static",
    "overlay_templates",
    "app/admin/static",
    "scripts/generate_openapi.py",
]

[tool.ruff.lint]
# Active rule families:
#   E/F/W       — pycodestyle + pyflakes basics
#   I           — import order
#   B           — flake8-bugbear (likely-bug patterns)
#   UP          — pyupgrade (modern Python idioms)
#   C90         — mccabe complexity (high cap, only catches egregious cases)
#   RUF         — ruff-specific (dangling tasks, unsorted ``__all__`` …)
#   SIM         — flake8-simplify (collapsible ifs, redundant code)
#
# E501 stays off because long URLs and fixture strings are common in tests and
# overlay payloads.
select = ["E", "F", "W", "I", "B", "UP", "C90", "RUF", "SIM"]
ignore = [
    "E501",
    # Codepoints the author actually intends (em dashes, smart quotes, the
    # 169.254.169.254 etc. literals we use in security tests). Manual triage
    # is more useful than a global rename so we keep these off.
    "RUF001",
    "RUF002",
    "RUF003",
    # Mutable default class attributes (mostly the existing
    # ``_connections: dict = {}`` pattern on classmethod-only registries).
    # Real but pre-existing; tighten in a follow-up.
    "RUF012",
    # ``str, Enum`` → ``StrEnum`` is a behaviour change (str() output) and
    # would need test coverage of the enum boundary; defer to refactor PR.
    "UP042",
    # Style preferences inside SIM that produce one-line ternaries which can
    # be harder to read than the original if/else.
    "SIM108",
    "SIM102",
    "SIM103",
    # try/except/pass → contextlib.suppress: the existing blocks carry
    # ``# nosec B110`` annotations consumed by Bandit and explanatory
    # comments; rewriting them mechanically would drop both.
    "SIM105",
]

[tool.ruff.lint.mccabe]
# Generous cap — flags only the genuinely-too-complex functions. The tree
# is currently clean at this cap: no C901 per-file-ignores are needed. (An
# earlier version of this comment claimed two functions were silenced
# below; they never were, and one of them has since moved to
# ``app/match_report_stats.py``.)
max-complexity = 18

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are intentionally called in default
# arguments — that's the framework contract, not a bug. Whitelist them so B008
# keeps catching genuine mistakes elsewhere.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Empty default hooks on OverlayBackend are deliberately no-ops, not abstract.
"app/overlay_backends/base.py" = ["B027"]
# ``pytest.raises(Exception)`` is used in a websocket-close smoke test where
# the exact Starlette exception is an implementation detail.
"tests/test_api_routes.py" = ["B017"]

[tool.mypy]
# The entire backend package is type-checked. Coverage was previously
# expanded module-by-module; now that the whole package is clean, checking
# ``app`` wholesale keeps new modules from silently escaping the gate.
files = [
    "app",
    "main.py",
]
python_version = "3.14"
follow_imports = "silent"
ignore_missing_imports = true
implicit_optional = false
# ``check_untyped_defs`` is on: without it mypy skips the *body* of every
# unannotated function, which hid 4 real errors across 3 modules while the
# gate reported "no issues found in 114 source files".
check_untyped_defs = true
# Keep every function signature inside the checked backend surface typed.
# Dynamic framework/JSON boundaries use explicit ``Any`` where a narrower
# contract is not available, so new untyped definitions cannot silently
# bypass body checking.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# ``requests`` ships its own stubs as ``types-requests`` but the project
# doesn't depend on it. ``ignore_missing_imports`` covers most cases, but
# the ``import-untyped`` error code is separate; silence it just for these
# import sites.
[[tool.mypy.overrides]]
module = ["requests", "requests.*", "websocket", "websocket._exceptions"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
log_cli = false
log_level = "WARNING"

[tool.bandit]
# Skip ``B101`` (asserts in test code) and ``B311`` (random for non-crypto)
# globally — both are deliberate in our codebase.
skips = ["B101", "B311"]
exclude_dirs = ["tests", "frontend", "scripts"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
# Kept in config, not only as a CI flag, so the plain
# ``pytest --cov=app`` documented in AGENTS.md enforces the same floor CI
# does. Raise deliberately; do not lower to make a red run pass.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
