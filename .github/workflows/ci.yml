name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-flight runs on PR branches. Pushes to main/dev still run
  # to completion so we keep a green-build signal on protected branches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Pytest and Linters (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.14 is what the
        # Dockerfile actually ships, so it must be exercised here too.
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip uv
        # Install pinned runtime + dev dependencies from lockfiles for reproducible builds.
        uv pip install --system -r requirements.lock -r requirements-dev.lock
        # Pin ruff and mypy to the same versions as .pre-commit-config.yaml so
        # local pre-commit and CI run identical checks. Floating to "latest"
        # previously let a newer mypy surface errors that a stale pinned
        # pre-commit hook never saw. Bumping these is a deliberate change that
        # should land in its own PR with the new findings reviewed.
        uv pip install --system ruff==0.15.8 mypy==1.19.1

    - name: Fail if requirements.lock does not match requirements.txt
      # CI and the Dockerfile install from the lock only, so a lock that
      # disagrees with requirements.txt makes the declared ranges fiction —
      # including the CVE floors. This caught fastapi, uvicorn and alembic
      # pinned under their stated minimums.
      #
      # Two distinct failures have to be caught, and they need two checks:
      #
      # 1. A pin that *violates* a declared range. Resolving requirements.txt
      #    with the lock as a constraints file surfaces this as an
      #    unsatisfiable resolution. Constraining rather than diffing a fresh
      #    compile is deliberate: a byte-diff would go red every time any
      #    dependency publishes a new release, whereas this only fails when
      #    the lock genuinely cannot satisfy the declared ranges.
      #
      # 2. A package *missing* from the lock. `--constraint` only constrains
      #    versions of packages it lists — it does not require that the lock
      #    covers everything requirements.txt pulls in. So uv happily
      #    resolves a newly-added dependency from the registry into the
      #    throwaway output and exits 0, while CI and the image keep
      #    installing the incomplete committed lock and only fail later at
      #    import time. Comparing the resolved pin set against the lock's
      #    closes that hole (and also catches stale leftovers in the lock).
      #
      # The resolved output goes to a real file under RUNNER_TEMP, not
      # /dev/null: uv writes a temp file alongside the output path and then
      # renames it, so ``-o /dev/null`` makes it try to create ``/dev/.tmpXXXX``
      # and fail with EACCES on the runner — which looked exactly like lock
      # drift. Only a genuine mismatch may fail this step, so the exit code
      # is captured separately from the diagnostic output.
      run: |
        CHECK="${RUNNER_TEMP}/requirements.lock.check"
        set +e
        out=$(uv pip compile requirements.txt \
                --constraint requirements.lock \
                -o "$CHECK" --quiet 2>&1)
        rc=$?
        set -e
        if [ $rc -ne 0 ]; then
          echo "$out"
          echo ""
          echo "::error::requirements.lock cannot satisfy requirements.txt (a pin violates a declared range)."
          echo "Run 'uv pip compile requirements.txt -o requirements.lock' and commit the result."
          exit 1
        fi
        # Normalise to a sorted set of PEP 503 name==version pins.
        norm() {
          grep -oiE '^[a-z0-9][a-z0-9._-]*==[^ ;]+' "$1" \
            | tr 'A-Z' 'a-z' | tr '_' '-' | sort -u
        }
        if ! delta=$(diff <(norm requirements.lock) <(norm "$CHECK")); then
          echo "$delta"
          echo ""
          echo "::error::requirements.lock is missing or has stale packages ('<' only in lock, '>' only in the resolved set)."
          echo "Run 'uv pip compile requirements.txt -o requirements.lock' and commit the result."
          exit 1
        fi

    - name: Lint with ruff
      run: ruff check .

    - name: Type-check with mypy
      run: mypy

    - name: Run Test Suite
      # Ensure tests have access to a clean environment
      env:
        APP_PORT: 8080
        UNO_OVERLAY_OID: dummy_token_for_tests
      run: |
        pytest tests/ \
          --cov=app \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=70

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # Suffixed with the matrix version — artifact names must be unique
        # across jobs in a run.
        name: coverage-xml-py${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

  frontend:
    name: Frontend and overlay asset quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r requirements.lock

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        # >= 22.22.0 is required by react-router 8; the Dockerfile's
        # frontend stage builds on a newer Node still, and that path is
        # exercised by the docker-build job.
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Regenerate OpenAPI schema and TypeScript types
      run: |
        python scripts/generate_openapi.py
        cd frontend && npm run gen:types

    - name: Fail if generated schema files drift from committed copies
      run: |
        if ! git diff --exit-code -- frontend/schema/openapi.json frontend/src/api/schema.d.ts; then
          echo ""
          echo "::error::Generated schema is out of date."
          echo "Run 'python scripts/generate_openapi.py && (cd frontend && npm run gen:types)' and commit the result."
          exit 1
        fi

    - name: Lint
      working-directory: frontend
      run: npm run lint

    - name: Prettier format check
      working-directory: frontend
      run: npm run format:check

    - name: Stylelint overlay CSS
      working-directory: frontend
      run: npm run stylelint

    - name: Typecheck
      working-directory: frontend
      run: npm run typecheck

    - name: Run Vitest with coverage gate
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload frontend coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: frontend/coverage/lcov.info
        if-no-files-found: ignore

  security-scan:
    # Surfaces dependency CVEs and risky-pattern findings on every PR.
    # The scanners are configured to FAIL on issues in the codebase /
    # the pinned lockfiles so a regression is caught before merge.
    # ``continue-on-error`` is intentionally NOT set: an operator
    # adding a vulnerable pin should see a red check and have to either
    # bump the dep or document the suppression in pyproject.toml /
    # ``# nosec`` comments.
    name: Security scanners (bandit, pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install scanners
      run: |
        python -m pip install --upgrade pip
        # Pin Bandit and pip-audit to known-good majors so the scan
        # output is stable across CI runs. Bumping them is a
        # deliberate operator decision that should land in its own
        # PR with the diff of new findings reviewed.
        pip install "bandit[toml]==1.7.*" "pip-audit==2.*"

    - name: Bandit static analysis
      # ``-r`` walks the package; ``-q`` suppresses progress output.
      # ``--severity-level medium`` filters out the LOW noise Bandit
      # emits for things like ``random`` usage in non-security paths;
      # we still want HIGH/MEDIUM findings to fail the job.
      # The repo already uses targeted ``# nosec`` comments where a
      # pattern is intentional (see app/auth_utils.py, app/match_report.py).
      run: |
        bandit -r app/ -q --severity-level medium

    - name: pip-audit (runtime lockfile)
      # Runs against the runtime lockfile so a CVE in a transitive
      # dep surfaces here. The dev lockfile is scanned in the next
      # step to catch issues in tooling without conflating the two.
      run: |
        pip-audit -r requirements.lock --strict

    - name: pip-audit (dev lockfile)
      run: |
        pip-audit -r requirements-dev.lock --strict

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        # >= 22.22.0 is required by react-router 8; the Dockerfile's
        # frontend stage builds on a newer Node still, and that path is
        # exercised by the docker-build job.
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: npm audit (runtime + transitive)
      working-directory: frontend
      # ``--omit=dev`` skips the toolchain (Vite, Vitest, etc.) so a
      # known-low CVE in a build-only dep doesn't block production
      # changes. ``--audit-level=high`` matches the Bandit threshold:
      # we want HIGH+ findings to fail, not every advisory.
      run: |
        npm audit --omit=dev --audit-level=high

  docker-build:
    name: Docker image build, scan, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Build production image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: volley-overlay-control:ci
        cache-from: type=gha,scope=docker-ci
        cache-to: type=gha,mode=max,scope=docker-ci

    - name: Smoke test production image
      run: |
        container_id="$(
          docker run --detach \
            --name volley-overlay-control-ci \
            --publish 127.0.0.1:8080:8080 \
            volley-overlay-control:ci
        )"

        cleanup() {
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Container logs"
            docker logs "$container_id" || true
            echo "::endgroup::"
          fi
          docker rm --force "$container_id" >/dev/null 2>&1 || true
          trap - EXIT
          exit "$status"
        }
        trap cleanup EXIT

        for attempt in $(seq 1 30); do
          if curl --fail --silent --output /dev/null \
              http://127.0.0.1:8080/health; then
            echo "Container passed its /health smoke test."
            exit 0
          fi

          if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
            echo "::error::Container exited before /health became ready."
            exit 1
          fi

          echo "Waiting for /health (attempt $attempt/30)..."
          sleep 2
        done

        echo "::error::Timed out waiting for /health."
        exit 1

    - name: Scan production image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: volley-overlay-control:ci
        scanners: vuln
        format: table
        ignore-unfixed: true
        vuln-type: os,library
        severity: HIGH,CRITICAL
        exit-code: 1
